name: flight recorder
on:
  schedule:
    - cron: '23 0 * * *'   # daily, 00:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw the recorder from fresh commit stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_flight_recorder.py
      - name: Commit if the trace moved
        run: |
          git config user.name "flight-recorder"
          git config user.email "actions@users.noreply.github.com"
          git add assets/recorder-*.svg
          git diff --cached --quiet || git commit -m "FDR: redraw from fresh stats [skip ci]"
          git push
